<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞船游戏 · 官网弹窗尺寸预览</title><link rel="icon" href="./favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#080e17;color:#dce6f1;font:14px system-ui}h1{color:#e6c485;font-size:20px}p{line-height:1.8;color:#a9bdd4;max-width:720px}button{cursor:pointer;padding:10px 15px;background:#142033;color:#e6eaf1;border:1px solid #476080;border-radius:4px}dialog{--host-width:min(960px,calc(100vw - 96px));--host-height:min(600px,calc(100dvh - 96px));--unit:clamp(1px,min(calc(var(--host-width) / 960),calc(var(--host-height) / 600)),3px);width:var(--host-width);height:var(--host-height);max-width:none;max-height:none;margin:auto;padding:0;border:1px solid #607284;border-radius:10px;background:#020408;overflow:hidden;box-shadow:0 28px 100px #0009}dialog::backdrop{background:#000b;backdrop-filter:blur(6px)}.viewport{position:absolute;inset:0;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transform-origin:top left}.window-action{position:absolute;z-index:5;top:calc(14 * var(--unit));right:calc(14 * var(--unit));width:calc(44 * var(--unit));height:calc(44 * var(--unit));padding:0;background:#080e16;border-color:#66809966;font-size:calc(20 * var(--unit))}#minimize{right:calc(62 * var(--unit))}.dock-bar,.restore-preview{display:none}dialog[data-state=docked]{--unit:1px;position:fixed;left:auto;top:auto;right:18px;bottom:18px;margin:0;width:min(340px,calc(100vw - 32px));height:calc(var(--preview-height,210px) + 46px)}[data-state=docked] .window-action{display:none}[data-state=docked] .dock-bar{display:flex;align-items:center;height:44px;padding-left:12px;gap:8px;color:#dfd3b8;font-size:12px}[data-state=docked] .dock-bar span{flex:1}[data-state=docked] .dock-bar button{width:40px;height:40px;padding:0;background:none;border:0}[data-state=docked] .viewport{top:44px}[data-state=docked] iframe{pointer-events:none}[data-state=docked] .restore-preview{display:block;position:absolute;z-index:2;inset:0;border:0;background:none;color:transparent}[data-state=docked] .restore-preview:hover{background:linear-gradient(transparent,#0008);color:#f5d99d}
@media(min-width:1800px){dialog{--host-width:min(2640px,70vw,calc(148.2dvh - 64px));--host-height:min(1584px,78dvh)}}@media(max-height:560px){dialog{--host-width:min(1100px,calc(100vw - 32px));--host-height:calc(100dvh - 32px)}}
</style></head><body><h1>官网弹窗尺寸预览</h1><p>此页在独立游戏目录中模拟官网现有窗口尺寸、右上控制和右下停靠。没有改动官网或第一款游戏。窗口缩小时保留原 iframe 尺寸，裁切战场作预览；恢复后继续本局。正式接入使用同源路径 <code>/games/ship-battle/?embed=1</code>。</p><button id="open">打开飞船游戏</button><dialog id="window" data-state="closed" aria-label="飞船游戏预览窗口"><button class="window-action" id="minimize" aria-label="缩小到右下角">−</button><button class="window-action" id="close" aria-label="收起战斗窗口">×</button><div class="dock-bar"><span>星际飞船大乱斗</span><button id="restore" aria-label="恢复战斗窗口">↗</button><button id="end" aria-label="结束并关闭战斗">×</button></div><div class="viewport"><iframe id="ship-game" title="星际飞船大乱斗" allow="fullscreen"></iframe><button class="restore-preview" aria-label="恢复战斗预览">点击恢复窗口</button></div></dialog><script>
const dialog=document.querySelector('dialog'),frame=document.querySelector('iframe'),viewport=document.querySelector('.viewport');let width=960,height=600,state='closed',raf=0;
function fit(){if(state==='docked'){const w=viewport.clientWidth,h=Math.min(210,w*.62);let crop={x:0,y:0,width,height};try{const r=frame.contentDocument.querySelector('.arena-stage').getBoundingClientRect();if(r.width&&r.height)crop=r;}catch{}const k=Math.max(w/crop.width,h/crop.height),x=(w-crop.width*k)/2-crop.x*k,y=(h-crop.height*k)*.8-crop.y*k;dialog.style.setProperty('--preview-height',h+'px');frame.style.cssText=`width:${width}px;height:${height}px;transform:translate(${x}px,${y}px) scale(${k})`;}else{frame.style.cssText='width:100%;height:100%;transform:none';if(state==='expanded'){width=viewport.clientWidth;height=viewport.clientHeight;}}}
function open(){if(!frame.src)frame.src='./?embed=1';if(dialog.open)dialog.close();state='expanded';dialog.dataset.state=state;dialog.showModal();fit();}
function dock(){if(state!=='expanded')return;width=viewport.clientWidth;height=viewport.clientHeight;state='docked';dialog.dataset.state=state;dialog.close();dialog.show();fit();}
function end(){state='closed';dialog.dataset.state=state;dialog.close();frame.removeAttribute('src');}
document.querySelector('#open').onclick=open;document.querySelector('#restore').onclick=open;document.querySelector('.restore-preview').onclick=open;document.querySelector('#minimize').onclick=dock;document.querySelector('#close').onclick=dock;document.querySelector('#end').onclick=end;dialog.addEventListener('cancel',e=>{e.preventDefault();dock();});dialog.addEventListener('click',e=>{if(e.target===dialog)dock();});frame.addEventListener('load',fit);new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}).observe(viewport);window.addEventListener('resize',fit);
</script></body></html>
