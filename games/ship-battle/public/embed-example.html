<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞船大乱斗 · 独立 iframe 接入示例</title><link rel="icon" href="./favicon.svg"><style>body{margin:0;padding:24px;background:#080e17;color:#dce6f1;font:14px system-ui}h1{font-size:20px;color:#e6c485}p{color:#8fa4bd;line-height:1.8}button{padding:10px 16px;margin:5px 8px 5px 0;background:#17243a;color:#dce6f1;border:1px solid #476080;border-radius:4px;cursor:pointer}dialog{width:min(1440px,96vw);height:min(900px,94dvh);padding:0;background:#080e17;color:#dce6f1;border:1px solid #7e704e;border-radius:6px;overflow:hidden}dialog::backdrop{background:#000b}.dialog-header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111b2a}.dialog-header{gap:8px}.dialog-header span{flex:1;white-space:nowrap}.dialog-header button{padding:4px 12px;margin:0}iframe{display:block;width:100%;height:calc(100% - 40px);border:0}output{display:block;font-size:12px;color:#b9c7dc;margin-top:14px;font-family:monospace}</style></head><body><h1>飞船游戏 iframe 接入示例</h1><p>此页面只是新游戏的独立接入示例，未修改官网入口或现有公共弹窗。</p><button id="open">打开飞船游戏</button><output id="events">等待游戏 ready 事件</output><dialog id="game"><div class="dialog-header"><span>星际飞船大乱斗</span><button data-command="pause">从父页面暂停</button><button data-command="resume">从父页面继续</button><button data-command="reset">从父页面重置</button><button id="close">关闭</button></div><iframe id="ship-game" title="星际飞船大乱斗" allow="fullscreen" src="./?embed=1"></iframe></dialog><script>
const frame=document.querySelector('#ship-game'),dialog=document.querySelector('#game'),events=document.querySelector('#events');
function command(value){frame.contentWindow?.postMessage({source:'gvy.ship-battle',version:1,type:'command',command:value},location.origin);}
document.querySelector('#open').onclick=()=>dialog.showModal();
document.querySelector('#close').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>command('pause'));
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.source!=='gvy.ship-battle'||event.data?.version!==1)return;events.value=JSON.stringify(event.data);});
</script></body></html>
